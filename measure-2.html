<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F4F9FF">
<title>记忆卡</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{--q:#16557F;--a:#2F6B4F;--tip:#8A7A66;--tipbg:#FDF8EC;--tipbar:#EFD9A8;
--acc:#2E6FC4;--accD:#23559B;--sunD:#C9861A;--rose:#D2534E;--roseD:#A83C39;--em:#0E9464;
--line:#DCE7F3;--line2:#C6D7EA;--tx:#1C2A38;--dim:#6A7C90;--dim2:#98A8BB}
body{background:linear-gradient(180deg,#F6FAFF 0%,#E7F1FC 58%,#DDE9F9 100%);background-attachment:fixed;
color:var(--tx);font:16px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
-webkit-user-select:none;user-select:none;overscroll-behavior:none;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:calc(9px + env(safe-area-inset-top)) 12px 7px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{margin:0;font-size:15.5px;font-weight:800;white-space:nowrap}
.brand em{font-style:normal;font-size:10.5px;color:var(--dim2);white-space:nowrap}
.counts{display:flex;gap:4px}
.cbox{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:4px 6px;text-align:center;min-width:40px;box-shadow:0 2px 5px rgba(36,86,150,.07)}
.cbox span{display:block;font-size:9px;color:var(--dim)}
.cbox b{font-size:13.5px;font-variant-numeric:tabular-nums}
.cbox.new b{color:var(--acc)}.cbox.hot b{color:var(--rose)}.cbox.mk b{color:var(--em)}
.gear{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--dim);font-size:16px;display:flex;align-items:center;justify-content:center}
.gear:active{background:#EFF5FC}
.screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.screen[hidden]{display:none!important}
#scrReview,#scrCards,#scrIndex{padding:0 12px}
.progline{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:2px 2px 8px;font-size:11.5px;color:var(--dim)}
.progbar{flex:1 1 auto;height:6px;border-radius:4px;background:#D8E5F5;overflow:hidden}
.progbar b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2E6FC4,#5E9BE6)}
.cardwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding:2px 0 8px}
.qcard{background:#fff;border:1px solid var(--line2);border-radius:20px;padding:19px 17px;box-shadow:0 6px 20px rgba(36,86,150,.1);display:flex;flex-direction:column;gap:13px;margin-bottom:auto;cursor:pointer}
.qcard.marked{border-color:#8FD3BA;box-shadow:0 6px 20px rgba(14,148,100,.14)}
.tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:#ECF1F6;color:#5C7080}
.tag.ghost{background:#F1F5FA;color:#8FA0B2;font-weight:600}
.tag.star{letter-spacing:0;padding:3px 7px}
.tag.code{background:#EDF1F7;color:#7A879B;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;padding:3px 7px}
.markbtn{margin-left:auto;width:30px;height:26px;border-radius:8px;flex:0 0 auto;border:1px solid var(--line2);background:#fff;color:#B9C6D6;font-size:13px;display:flex;align-items:center;justify-content:center}
.markbtn.on{background:var(--em);border-color:transparent;color:#fff;box-shadow:0 2px 6px rgba(14,148,100,.32)}
.idxline{font-size:10.5px;color:var(--dim2);margin-top:-7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idxline b{color:var(--dim)}
.qtext{font-size:21px;font-weight:700;line-height:1.62;color:var(--q);word-break:break-word}
.askhint{display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 0 6px;color:var(--dim2);font-size:13px}
.askhint i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#EFF5FC;display:flex;align-items:center;justify-content:center;font-size:12px}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.atext{font-size:19px;line-height:1.78;color:var(--a);font-weight:600;word-break:break-word}
.qtext sub,.qtext sup,.atext sub,.atext sup,.tipbox sub,.tipbox sup{font-size:.66em;line-height:0;font-weight:700}
.atext b{font-weight:800;background:linear-gradient(transparent 62%,rgba(239,163,43,.3) 62%)}
.tipbox{background:var(--tipbg);border-left:3px solid var(--tipbar);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;line-height:1.65;color:var(--tip)}
.tipbox u{text-decoration:none;font-weight:700;color:#8A6A3A}
.refbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line2);padding-top:10px}
.refbox span{font-size:11px;color:var(--dim2);font-weight:700}
.refchip{font:800 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:5px 9px;border-radius:8px;background:#EAF2FC;color:var(--accD);border:1px solid #CFE0F3}
.gradebar{flex:0 0 auto;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}
.navbtn{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--dim);font:700 13px/1 inherit}
.navbtn:active{background:#EFF5FC}
.navbtn:disabled{color:#C8D4E2;background:#F7FAFD;border-color:#E4EDF7}
.navpos{font:800 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--dim2);font-variant-numeric:tabular-nums}
.revealbtn{width:100%;height:54px;border-radius:16px;background:var(--acc);color:#fff;font:800 17px/1 inherit;letter-spacing:1px;border:0;box-shadow:0 6px 16px rgba(46,111,196,.3)}
.revealbtn:active{background:var(--accD)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades.two{grid-template-columns:repeat(2,1fr)}
.gbtn{height:58px;border-radius:16px;border:1.5px solid;font:800 16px/1.2 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#fff}
.gbtn small{font-size:10px;font-weight:600;opacity:.72}
.gbtn.f{color:var(--rose);border-color:#F1C4C2;background:#FFF6F5}
.gbtn.o{color:var(--acc);border-color:#C2D9F2;background:#F5FAFF}
.gbtn.e{color:var(--sunD);border-color:#F3DFB4;background:#FFFCF3}
.gbtn.sel{box-shadow:0 0 0 2px currentColor inset}
.gradednote{display:flex;align-items:center;justify-content:center;height:44px;border-radius:13px;background:#F2F8F5;color:#5E8B78;font:800 13.5px/1 inherit;border:1px dashed #CBE4D8}
.state{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;padding:22px}
.state .big{font-size:44px;line-height:1}
.state h2{margin:0;font-size:20px;font-weight:800}
.state p{margin:0;color:var(--dim);font-size:14px;line-height:1.7;max-width:320px}
.state .row{display:flex;gap:9px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.pbtn{height:46px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;color:var(--tx);font:800 15px/1 inherit}
.pbtn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(46,111,196,.3)}
.pbtn:active{transform:scale(.98)}
.donebox{background:#fff;border:1px solid var(--line2);border-radius:18px;padding:16px;display:flex;box-shadow:0 6px 18px rgba(36,86,150,.09);width:100%;max-width:330px}
.dstat{flex:1;text-align:center;border-right:1px solid var(--line)}
.dstat:last-child{border:0}
.dstat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.dstat span{font-size:11px;color:var(--dim)}
.dstat.f b{color:var(--rose)}.dstat.o b{color:var(--acc)}.dstat.e b{color:var(--sunD)}
.searchrow{flex:0 0 auto;display:flex;gap:8px;margin-bottom:8px}
.searchrow input{flex:1 1 auto;height:42px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 13px;font:15px inherit;color:var(--tx);outline:none;-webkit-user-select:text;user-select:text;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:17px;color:var(--dim);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.crumb{flex:0 0 auto;display:flex;align-items:center;gap:6px;margin-bottom:8px;background:#EAF2FC;border:1px solid #CFE0F3;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:700;color:var(--accD)}
.crumb[hidden]{display:none!important}
.crumb span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{font-size:11px;color:var(--dim);padding:2px 6px;border-radius:7px;background:#fff}
.chips{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--acc);border-color:transparent;color:#fff}
.chip.mark{color:#0A7550;border-color:#B7E0D0}
.chip.mark.on{background:var(--em);border-color:transparent;color:#fff}
.listwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.litem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.litem:active{background:#F7FBFF}
.litem.marked{border-color:#A9DCC8;background:#F8FDFB}
.ldot{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto;margin:2px 0;background:#8FA0AF}
.lmain{flex:1 1 auto;min-width:0}
.lq{font-size:14.5px;font-weight:700;line-height:1.5;color:var(--q);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lmeta{margin-top:4px;font-size:11px;color:var(--dim2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lflag{color:var(--em);font-weight:800}
.lidx{color:#A8B8C8;font-size:10.5px}
.lcode{color:#9AA6B8;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;font-weight:800}
.lright{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.stage{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:#F1F5FA;color:#71879C}
.stage.new{background:#E3EFFC;color:var(--accD)}
.stage.due{background:#FDECEB;color:var(--roseD)}
.ldel{font-size:11px;color:#C0AEA8;padding:2px 4px;border-radius:6px}
.more{width:100%;height:44px;border-radius:12px;border:1px dashed var(--line2);background:transparent;color:var(--dim);font:700 13px inherit;margin-bottom:10px}
.more.go{border-style:solid;border-color:#B7E0D0;background:#F4FBF8;color:#0A7550;font-weight:800}
.empty{text-align:center;padding:40px 10px;color:var(--dim2);font-size:14px}
.idxwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px}
.idxsum{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:12px 13px;margin-bottom:10px;font-size:12.5px;color:var(--dim);line-height:1.7}
.idxsum b{color:var(--accD);font-weight:800}
.idxrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:6px}
.idxrow:active{background:#F7FBFF}
.idxrow.l1{font-weight:800;font-size:15px;border-color:var(--line2)}
.idxrow.l2{margin-left:12px;font-weight:700;font-size:14px;border-left:3px solid #CFE0F3}
.idxrow.l3{margin-left:24px;font-size:13.5px;color:var(--dim);border-left:3px solid #E3EFFC}
.idxname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idxcnt{font-size:11.5px;font-weight:800;color:var(--acc);background:#E3EFFC;border-radius:8px;padding:3px 8px;flex:0 0 auto}
.idxarrow{color:var(--dim2);font-size:11px;width:12px;text-align:center;flex:0 0 auto}
.idxtip{font-size:11.5px;color:var(--dim2);line-height:1.7;padding:12px 4px;border-top:1px dashed var(--line2);margin-top:8px}
.fab{position:absolute;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:27px;font-weight:300;line-height:1;z-index:8;box-shadow:0 7px 20px rgba(46,111,196,.38);display:flex;align-items:center;justify-content:center}
.fab[hidden]{display:none!important}
.tabs{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 14px rgba(36,86,150,.06)}
.tab{flex:1;height:56px;border:0;background:transparent;color:var(--dim2);font:700 12px/1.3 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.tab i{font-style:normal;font-size:18px;line-height:1}
.tab.on{color:var(--accD)}
.tab .badge{position:absolute;top:8px;margin-left:24px;min-width:16px;height:16px;border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.mask{position:fixed;inset:0;background:rgba(18,32,50,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.mask[hidden]{display:none!important}
.sheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sheet h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sheet h3 em{font-style:normal;font-size:12px;color:var(--dim2);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--dim)}
.field textarea,.field input{width:100%;border:1px solid var(--line2);border-radius:11px;padding:10px 12px;font:15px/1.6 inherit;color:var(--tx);background:#FAFCFF;outline:none;-webkit-user-select:text;user-select:text}
.cnt{font-size:11px;color:var(--dim2);text-align:right}
.cnt.over{color:var(--rose);font-weight:700}
.sheet .row{display:flex;gap:8px;margin-top:2px}
.sheet .row button{flex:1;height:46px;border-radius:13px;border:1.5px solid var(--line2);background:#fff;font:800 15px inherit;color:var(--tx)}
.sheet .row .pri{background:var(--acc);border-color:transparent;color:#fff}
.sheet .row .danger{color:var(--rose);border-color:#F1C4C2;background:#FFF7F6}
.optrow{display:flex;gap:6px;flex-wrap:wrap}
.opt{padding:8px 12px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font:800 13px/1 inherit;color:var(--dim)}
.opt.on{background:var(--acc);border-color:transparent;color:#fff}
.opt.mk.on{background:var(--em);border-color:transparent;color:#fff}
.idxhint{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim2)}
.idxhint span{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idxhint b{color:var(--acc);font-weight:700}
.note{font-size:11.5px;color:var(--dim2);line-height:1.7;background:#F6FAFF;border-radius:10px;padding:9px 11px}
.note b{color:var(--dim);font-weight:800}
.toast{position:fixed;left:50%;transform:translate(-50%,140%);bottom:calc(86px + env(safe-area-inset-bottom));background:rgba(24,38,56,.95);color:#fff;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:13px;z-index:60;opacity:0;transition:transform .22s,opacity .22s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
#fatal{position:fixed;inset:0;z-index:99;background:#fff;padding:20px;font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#B3261E;overflow:auto;white-space:pre-wrap}
/* ===== 工具按钮：计时 / 日历 ===== */
.tools{display:flex;gap:5px;flex:0 0 auto}
.tbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:#fff;
  color:var(--acc);display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.tbtn:active{background:#EFF5FC}
.tbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tbtn .live{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;
  background:var(--em);opacity:0}
.tbtn.on{color:var(--em);border-color:#B7E0D0}
.tbtn.on .live{opacity:1}

.tool-mask{position:fixed;inset:0;background:rgba(18,32,50,.42);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:18px}
.tool-mask[hidden]{display:none!important}
.tool-card{width:min(100%,380px);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;
  padding:16px 16px 14px;box-shadow:0 20px 50px rgba(20,30,50,.28)}
.tool-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tool-head h3{margin:0;font-size:16px;font-weight:800;color:var(--accD)}
.tool-head p{margin:3px 0 0;font-size:11.5px;color:var(--dim2);line-height:1.5}
.tool-x{border:0;background:transparent;color:var(--dim);font-size:22px;line-height:1;
  padding:2px 6px;border-radius:8px}
.tool-x:active{background:#EFF5FC}

.tm-big{font:800 36px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--accD);
  text-align:center;margin:18px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.tm-status{text-align:center;font-size:11.5px;color:var(--dim2)}
.tm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.tm-grid div{background:#F7FAFD;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.tm-grid span{display:block;font-size:10.5px;color:var(--dim)}
.tm-grid b{font-size:14px;font-variant-numeric:tabular-nums}
.tm-actions{display:flex;gap:8px}
.tm-actions button{flex:1;height:42px;border-radius:12px;border:1.5px solid var(--line2);
  background:#fff;font:800 14px/1 inherit;color:var(--tx)}
.tm-actions .pri{background:var(--acc);border-color:transparent;color:#fff}

.cal-nav{display:flex;align-items:center;gap:5px;margin:12px 0 10px}
.cal-nav button{border:1px solid var(--line2);background:#fff;color:var(--dim);
  border-radius:8px;font-family:inherit;cursor:pointer}
.cal-prev,.cal-next{width:26px;height:28px;font-size:16px;line-height:1;padding:0}
.cal-month{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--accD);white-space:nowrap}
.cal-today{height:28px;padding:0 7px;font-size:11px;font-weight:700;color:var(--acc);
  background:#EAF2FC!important;border-color:var(--line2)!important;white-space:nowrap}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:10px;color:var(--dim2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{min-height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;
  color:var(--tx);font-family:inherit;font-size:12.5px;position:relative;
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.cal-day.blank{border-color:transparent;background:transparent;pointer-events:none}
.cal-day.today{border-color:var(--acc);border-width:1.5px}
.cal-day.has{background:#F4FBF8}
.cal-day.sel{background:#EAF2FC;border-color:var(--acc)}
.cal-day .d{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--em)}
.cal-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--dim);min-height:44px;line-height:1.7}
.cal-detail b{color:var(--tx);font-size:13px}

.tabtools{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:0 10px 0 6px;border-left:1px solid var(--line)}
.tabtools .tbtn{width:32px;height:32px}

<script>
"use strict";
/* ==========================================================================
   ① 内容配置区 —— 换内容只需要改这一段
   --------------------------------------------------------------------------
   卡片格式（SEED_SOURCE 里每行一张）：
       问题 | 答案 | 标签
   · 问题前写 #T001  → 编号
   · 问题前写 ★ / ★★ / ★★★ → 重要度
   · 答案里写 <b>重点</b> → 加粗高亮
   · 答案里写 <br><u>易错：…</u> → 自动拆成黄色提示框
   · 标签用 :: 分隔，例如 312::统计::ANOVA（最后一个显示为彩色标签）

   每次改完内容，把下面的 seedVer 加 1，否则不会自动补进已有数据。
   注意：内容里不要出现反引号 ` 和 ${ ，会破坏模板字符串。
   ========================================================================== */

const APP = {
  name: '312 测量统计 2',        // 顶栏标题
  sub: '间隔复习',               // 副标题前缀
  key: 'memcard.psy312m2.v1',    // 存档键名
  cramKey: 'memcard.psy312m2.cram',
  seedVer: 1                     // 内容版本号
};

const MAX_CARDS = 3000;
const LIM_Q = 400, LIM_A = 2000, LIM_T = 500;
const INTERVALS = [0,1,2,4,7,15,30,60];
const STAGE_MAX = INTERVALS.length - 1;

/* 索引第一层（固定） */
const TOP = '心理学';

/* 索引第二层：科目 */
const SUBJECTS = ['实验心理学','心理统计','心理测量','普通心理学','发展心理学',
                  '教育心理学','社会心理学','其他'];
const DEFAULT_SUBJECT = '其他';

/* 关键词 → 科目（从上往下匹配，先中先得） */
const SUBJECT_RULES = [
  [/心理统计|统计/,        '心理统计'],
  [/心理测量|测量|信度|效度/, '心理测量'],
  [/发展心理/,             '发展心理学'],
  [/教育心理/,             '教育心理学'],
  [/社会心理/,             '社会心理学'],
  [/普通心理/,             '普通心理学'],
  [/实验心理/,             '实验心理学']
];

/* 索引第三层：类型（从上往下匹配，先中先得；都不中则用 TYPES 最后一项） */
const TYPES = ['核心概念','计算相关','关联知识','其他'];
const TYPE_RULES = [
  ['关联知识', /关系|区别|异同|联系|不同|为什么|为何|如何|怎样|影响|优点|缺点|局限|排序|属于|哪个|哪几|适用/],
  ['计算相关', /怎么算|怎么分解|怎么计算|怎么求|如何算|求|计算|多少|几次|数目|配对数|自由度|平方和|等于|反推|推算/],
  ['核心概念', /什么|定义|思想|含义|指什么|前提|假设|条件|要点|特征|原则|性质/]
];

/* 内置题库：格式 问题|答案|标签 */
const SEED_SOURCE = `
<b>#084 ★★★ 集中趋势的三个指标分别适用于什么数据？</b>|算术平均数：等距或等比数据、分布大致对称时最佳，能利用全部信息；中数：有极端值或开口数据、偏态分布时用；众数：称名数据、或只想知最常见类别时用。<br><u>易错：数据是"称名"水平时只能用众数；有极端值时平均数被严重拉动，必须换中数。</u>|统计::描述统计
<b>#085 ★★ 平均数、中数、众数在偏态分布中的位置关系？</b>|正偏态（右偏）时 众数＜中数＜平均数；负偏态（左偏）时 平均数＜中数＜众数。对称分布时三者重合。<br><u>易错：记住"平均数永远被尾巴拉走"——尾巴在哪边，平均数就偏向哪边。</u>|统计::描述统计
<b>#086 ★★★ 离散趋势的主要指标有哪些？各自的适用条件？</b>|全距（粗略、不稳定）；四分位差（配合中数，用于偏态或开口数据）；平均差（少用）；方差与标准差（等距等比数据、正态分布时的首选）；变异系数（不同单位或均值相差悬殊时比较离散程度）。<br><u>易错：比较两组数据的离散程度，单位相同且均值接近比标准差；否则必须用变异系数。</u>|统计::描述统计
<b>#087 ★★★ 变异系数的公式与适用场合？</b>|CV＝S／X̄×100%（标准差除以平均数）。用于：①单位不同的两组数据比较；②单位相同但平均数相差悬殊时比较。<br><u>易错：CV 是无名数（可跨单位比较），但它建立在等比量表之上，称名数据不能用。</u>|统计::描述统计
<b>#088 ★★★ 标准分数 z 的定义、性质与用途？</b>|z＝(X－X̄)／S，表示某分数在团体中偏离平均数几个标准差。性质：均值为 0、标准差为 1、无单位、可加可比。用途：跨测验比较、合成不同测验分数、判断异常值。<br><u>易错：z 分数的比较必须建立在"同一团体、同一分布"上，跨团体的 z 不能直接比。</u>|统计::描述统计
<b>#089 ★★★ 各种相关系数分别用于什么类型的数据？</b>|积差相关：两列都是连续变量、线性关系、近似正态；斯皮尔曼等级相关：两列都是等级（或非正态、样本小）；肯德尔 W：多个评分者对多个对象的一致性；点二列相关：一列连续＋一列真正二分（如性别）；二列相关：一列连续＋一列人为二分（如及格／不及格）；φ 相关：两列都是二分变量；四分相关：两列连续、但都被人为二分。<br><u>易错："真正二分"（事物本身两类）用点二列，"人为二分"（连续变量切一刀）用二列——这是全章最易错的一处。</u>|统计::描述统计
<b>#090 ★★ 积差相关系数的使用条件与取值范围？</b>|条件：成对数据、两列均为连续变量、两变量的关系为线性、两变量近似正态、样本量足够。取值范围 －1 ≤ r ≤ ＋1。<br><u>易错：r＝0 只说明"无线性关系"，不排除存在曲线关系（如倒 U 形的 r 接近 0）。</u>|统计::描述统计
<b>#091 ★★ 决定系数的含义是什么？</b>|r²，表示两变量共变的百分比，即一个变量的变异可由另一个变量解释的比例。例如 r＝0.60，则 r²＝0.36，说明 36% 的变异可被解释。<br><u>易错：r＝0.6 不是"60% 的关系"，必须平方后再解释——这是最常被误读的数字。</u>|统计::描述统计
<b>#092 ★★★ 正态分布有哪些重要性质？</b>|钟形、单峰、对称；均值＝中数＝众数；曲线下总面积为 1；多数集中在平均数附近，离平均数越远概率越小；由 μ 与 σ 完全决定；可经 z 变换化为标准正态。<br><u>易错：正态分布是"理论模型"，实际数据只能近似；偏态数据先转换再用正态法。</u>|统计::概率与抽样分布
<b>#093 ★★ 正态分布下几个必须记住的面积比例？</b>|±1σ 之间约 68.26%；±1.96σ 之间约 95%；±2.58σ 之间约 99%。<br><u>易错：1.96 对应 95%、2.58 对应 99%，这两个数字与置信区间的临界值直接挂钩，必须固化。</u>|统计::概率与抽样分布
<b>#094 ★★ 二项分布的均值、方差及正态近似条件？</b>|均值＝np，方差＝npq（q＝1－p）。当 np≥5 且 nq≥5 时，二项分布趋近正态，可用正态法近似。<br><u>易错：p＝0.5 时分布对称，p≠0.5 时偏态；n 越大越接近正态，但"n 大"不是唯一条件。</u>|统计::概率与抽样分布
<b>#095 ★★★ t 分布、χ² 分布、F 分布各有什么特点？分别在什么场合使用？</b>|t 分布：对称、以 0 为中心、比正态低峰厚尾，随 df 增大趋近正态，用于σ 未知时检验均值；χ² 分布：正偏态、只取正值、有可加性，用于计数数据与方差估计；F 分布：正偏态、有两个自由度、取值非负，用于方差比（方差齐性、方差分析、回归检验）。<br><u>易错：t 用于"均值"的检验，F 用于"方差"的检验；F 的倒数关系是 F(1－α)＝1／F(α)。</u>|统计::概率与抽样分布
<b>#096 ★★★ 中心极限定理的内容及其意义？</b>|从任意总体中抽取容量为 n 的样本，当 n 足够大（一般 n≥30） 时，样本均值的分布趋近正态，其均值等于总体均值 μ，标准差等于 σ／√n，与总体本身的分布形态无关。<br><u>易错：趋近正态的是"样本均值的分布"，不是原始数据分布——这是全部推断统计的基石。</u>|统计::概率与抽样分布
<b>#097 ★★★ 标准误与标准差有什么区别？</b>|标准差描述一批原始分数的离散程度；标准误描述样本统计量的抽样分布的离散程度（即抽样误差大小）。平均数标准误 SE＝σ／√n，估计时用 s／√n。<br><u>易错：标准误随 n 增大而减小（与 √n 成反比），标准差不会因 n 增大而系统变小。</u>|统计::概率与抽样分布
<b>#098 ★★ 自由度的含义是什么？几个常用检验的自由度如何算？</b>|自由度是计算统计量时取值不受限制的变量个数。单样本 t：n－1；独立样本 t：n₁＋n₂－2；配对 t：对数－1；单因素方差分析：组间 k－1、组内 N－k；χ² 独立性：(r－1)(c－1)。<br><u>易错：自由度算错是最"冤"的失分，因为公式和思路都对，只是减错了数。</u>|统计::概率与抽样分布
<b>#099 ★★ 良好点估计量的四个标准是什么？</b>|无偏性（多次抽样的期望值等于总体参数）、有效性（方差更小者更有效）、一致性（n 增大时趋近总体参数）、充分性（充分利用样本信息）。<br><u>易错：样本方差用 n－1 作分母，正是为了保证无偏性；用 n 作分母则是有偏估计。</u>|统计::参数估计
<b>#100 ★★★ 置信区间的宽窄受哪些因素影响？</b>|置信水平越高（如 99% 比 95%）→ 区间越宽；样本容量越大 → 区间越窄；总体变异（σ 或 s）越大 → 区间越宽。区间越窄，估计越精确。<br><u>易错：置信水平与精确度是矛盾的——想更"有把握"就必然更"不精确"。</u>|统计::参数估计
<b>#101 ★★★ 估计总体平均数时，什么时候用 z、什么时候用 t？</b>|总体方差 σ 已知→ 用 z 分布（X̄±z·σ／√n）；σ 未知、用样本方差 s 估计→ 用 t 分布（X̄±t·s／√n）。大样本（n≥30）时两者结果接近，但严格来说仍应按 σ 是否已知来选。<br><u>易错：判断依据是"总体方差是否已知"，不是"样本量大小"——这是最高频的选择错误。</u>|统计::参数估计
<b>#102 ★★★ 假设检验的基本逻辑与两类错误是什么？</b>|逻辑：先假设 H₀ 成立，看样本结果落在其抽样分布中的概率，若概率＜α 则拒绝 H₀。Ⅰ 型错误（α）：H₀ 为真却拒绝，即弃真；Ⅱ 型错误（β）：H₀ 为假却接受，即存伪。<br><u>易错：假设检验不能"证明"H₀ 为真，只能说"没有足够证据拒绝它"。</u>|统计::假设检验
<b>#103 ★★★ α、β 与统计效力之间是什么关系？如何提高统计效力？</b>|统计效力＝1－β，指正确拒绝虚假 H₀ 的概率。α 增大则 β 减小、效力提高；样本量增大时 α 与 β 可同时减小；此外效应量越大、数据变异越小，效力越高。<br><u>易错：α＋β 一般不等于 1；"增大样本量"是唯一能同时压低两类错误的手段。</u>|统计::假设检验
<b>#104 ★★ 什么时候用单侧检验、什么时候用双侧？</b>|双侧：只关心"是否有差异"、无方向预期时用；单侧：有明确的方向性假设（如"实验组优于对照组"）且理论上站得住时用。同一 α 下单侧检验更容易达到显著。<br><u>易错：不能看到数据方向后再改成单侧，那是事后投机，会虚增 Ⅰ 型错误。</u>|统计::假设检验
<b>#105 ★★ 假设检验中有哪些必须注意的问题？</b>|① 显著性不等于实际重要性（大样本下微小差异也显著）；② p 值不是"H₀ 为真的概率"；③ 结论受样本代表性制约；④ 多重比较会虚增 Ⅰ 型错误。<br><u>易错：p＜0.05 只说明"差异不太可能由抽样误差造成"，不说明差异很大。</u>|统计::假设检验
<b>#106 ★★★ 参数检验有哪些前提假定？不满足时怎么办？</b>|三个基本假定：正态性（总体服从正态分布）、方差齐性（各组总体方差相等）、独立性（各观测值相互独立）；方差分析另需可加性。不满足时：改用非参数检验，或先做数据转换（对数、平方根、反正弦）。<br><u>易错：多数参数检验对方差齐性并不太敏感（尤其样本量相等时），但对"独立性"违背毫无抵抗力，配对数据绝不能当独立样本处理。</u>|统计::假设检验
<b>#107 ★★★ 单样本 t 检验的条件与公式？</b>|条件：一个样本、总体方差未知、总体近似正态。公式 t＝(X̄－μ₀)／(s／√n)，df＝n－1。检验的是"样本所来自的总体均值是否等于某个给定值"。<br><u>易错：s／√n 是"平均数的标准误"，不是样本标准差；分母写错是常见事故。</u>|统计::t检验
<b>#108 ★★★ 独立样本 t 检验与配对样本 t 检验如何选择？</b>|看两组数据是否来自同一批被试：两组被试完全不同（如实验组 vs 对照组）→ 独立样本 t；同一批被试的两次测量，或按某属性配对（如双生子、配对设计）→ 配对（相关样本）t。配对 t 检验的是差值的均值，df＝对数－1。<br><u>易错：同一批人前后测若误用独立样本 t，会丢弃配对信息，检验效力大幅下降——这是综合题常见失分点。</u>|统计::t检验
<b>#109 ★★ 独立样本 t 检验为何要先做方差齐性检验？不齐怎么办？</b>|因为合并方差的前提是两组总体方差相等。先做 F 检验（或 Levene 检验）判断齐性；若方差不齐，改用校正的 t 检验（Welch 法，调整自由度），或改用非参数检验。<br><u>易错：两组样本量不相等时，方差齐性的假设更关键，不能跳过。</u>|统计::t检验
<b>#110 ★★ t 检验与 z 检验的选用依据？</b>|核心是总体方差是否已知：已知用 z，未知用 t。大样本时 t 分布趋近正态，两者结果几乎相同，但理论依据不同。<br><u>易错：不必背"n≥30 就用 z"这种简化规则，考试要的是判断依据。</u>|统计::t检验
<b>#111 ★★★ 方差分析的基本思想是什么？</b>|把总变异分解为组间变异（处理效应＋误差）与组内变异（纯误差），用两者的均方之比 F＝MS_组间／MS_组内 判断组间差异是否显著。若 F 接近 1，说明处理效应可忽略。<br><u>易错：F 检验显著只说明"至少有一组与其他组不同"，不能直接说"每两组都不同"，须做事后检验。</u>|统计::方差分析
<b>#112 ★★★ 方差分析的使用条件有哪些？</b>|① 各样本独立；② 各总体正态；③ 各总体方差齐性；④ 变异具有可加性（各变异分量可相加）。<br><u>易错：方差分析对正态性有一定耐受度，但对"独立性"和"可加性"要求严格。</u>|统计::方差分析
<b>#113 ★★★ 单因素完全随机设计与随机区组设计的变异分解和自由度有何不同？</b>|完全随机：SS_总＝SS_组间＋SS_组内，df_组间＝k－1、df_组内＝N－k，F＝MS_组间／MS_组内。随机区组：SS_总＝SS_处理＋SS_区组＋SS_误差，df_误差＝(k－1)(n－1)，F＝MS_处理／MS_误差。区组设计把个体差异从误差中分离出去，使误差项变小、检验更灵敏。<br><u>易错：随机区组的 F 分母是 MS_误差，不是 MS_区组；分母用错是本部分最常见的错误。</u>|统计::方差分析
<b>#114 ★★ 事后检验的作用与方法有哪些？</b>|作用：F 显著后，进一步判断具体哪两组之间存在差异。常用方法：LSD（最宽松）、N－K（q 检验）、Tukey（HSD）、Scheffé（最保守）、Duncan。方法越保守，越不容易犯 Ⅰ 型错误但效力越低。<br><u>易错：事后检验只能在 F 显著之后做；F 不显著却做两两比较属于统计滥用。</u>|统计::方差分析
<b>#115 ★★★ 什么是交互作用？如何在图中判断？</b>|一个因素的效应随另一个因素的水平而变化，即两因素并非各自独立起作用。判断方法：画交互作用图，若两条线不平行（交叉或明显不平行）则存在交互作用；平行则无交互作用。<br><u>易错：存在交互作用时，不宜再单独解释主效应，必须按简单效应分别说明。</u>|统计::方差分析
<b>#116 ★★★ 为什么多组比较不能反复使用 t 检验？</b>|因为多次检验会使犯 Ⅰ 型错误的概率累积膨胀（做 3 次 α＝0.05 的检验，总错误率约 1－0.95³≈14%）。方差分析先用一个 F 检验控制总错误率，显著后再用事后检验处理两两比较。<br><u>易错：这是实验设计题的高频考点，标准答法是"t 检验会膨胀 Ⅰ 型错误，方差分析可控制实验误差"。</u>|统计::方差分析
<b>#117 ★★ 重复测量方差分析的原理与优势？</b>|同一批被试接受所有处理，把被试间差异从误差中分离出去。优势：控制个体差异、减少被试量、提高检验效力。代价：存在顺序效应与练习效应，需做平衡设计（如拉丁方）。<br><u>易错：重复测量必须检验"球形性"假设，违背时需校正自由度。</u>|统计::方差分析
<b>#118 ★★★ 相关分析与回归分析有什么区别与联系？</b>|相关：两变量地位平等、双向、只描述关联强度与方向；回归：有自变量与因变量之分、有方向性、用于预测。联系：b＝r·(S_y／S_x)，r 与 b 的显著性检验等价（t²＝F）。<br><u>易错：相关不蕴含因果，回归的"预测"也不等于"因果解释"——这是论述题的固定得分点。</u>|统计::回归
<b>#119 ★★ 回归方程中截距与回归系数的含义？</b>|Ŷ＝a＋bX，b 为回归系数，表示 X 每变动一个单位，Y 平均变动多少；a 为截距，即 X＝0 时 Y 的预测值（有时无实际意义）。<br><u>易错：a 在自变量不能取 0 时没有实际解释意义，不要硬解释。</u>|统计::回归
<b>#120 ★★ 回归方程的显著性检验怎么做？</b>|两种等价方式：① 对回归方程整体做 F 检验，F＝MS_回归／MS_残差，df＝(1, n－2)；② 对回归系数做 t 检验，df＝n－2。一元回归中两者结论一致。<br><u>易错：多元回归中"方程整体显著"与"每个系数显著"是两回事，可能整体显著而个别系数不显著。</u>|统计::回归
<b>#121 ★★★ 估计标准误的含义与计算？</b>|S_yx＝S_y·√(1－r²)，表示用回归方程预测时预测误差的大小。r 越大、S_y 越小，预测越准确。可用于对个体预测值做区间估计。<br><u>易错：S_yx 与"平均数标准误"不是一回事，一个描述预测精度，一个描述抽样误差。</u>|统计::回归
<b>#122 ★ 多元回归中的共线性问题指什么？有何后果？</b>|自变量之间高度相关，导致回归系数估计不稳定、符号反常、难以解释。可通过相关系数矩阵、容忍度、方差膨胀因子（VIF）诊断，用逐步回归或主成分法处理。<br><u>易错：多元回归系数是"控制了其他变量后"的效应，不能与一元回归系数直接比较。</u>|统计::回归
<b>#123 ★★★ χ² 检验有哪几种类型？各自的自由度如何算？</b>|① 拟合优度检验：比较实际次数与理论次数分布是否吻合，df＝k－1；② 独立性检验：判断两分类变量是否有关联，df＝(r－1)(c－1)；③ 同质性检验：比较不同样本在某分类变量上的分布是否一致。<br><u>易错：拟合优度 df＝k－1，若用样本数据估计了总体参数，还要再减去估计的参数个数。</u>|统计::卡方与非参数
<b>#124 ★★★ χ² 检验的适用条件有哪些？</b>|数据为计数数据（称名或分类）；各分类互斥且穷尽；观测值相互独立；理论上要求每个格子的期望次数不小于 5，小于 5 时需合并类别或用精确检验。<br><u>易错：期望次数过小会导致 χ² 值虚增、结论偏松，是小样本 χ² 检验的经典陷阱。</u>|统计::卡方与非参数
<b>#125 ★★★ 非参数检验的适用场合与优缺点？</b>|适用：总体分布未知或不满足正态、样本量小、数据为等级或顺序、方差不齐、有开口数据。优点：条件宽松、适用面广、计算简便；缺点：没有利用数据的全部信息，检验效力低于同等条件的参数检验。<br><u>易错：不是"非参数检验更高级"，在满足参数检验条件时，用非参数法会降低效力、更容易漏掉真实差异。</u>|统计::卡方与非参数
<b>#126 ★★ 常用的非参数检验方法有哪些？各对应什么设计？</b>|符号检验（配对、仅用方向）、Wilcoxon 符号秩和检验（配对、用方向＋大小）、Mann-Whitney U 秩和检验（两独立样本）、中数检验（两独立样本）、Kruskal-Wallis 单向秩次方差分析（多独立样本）、Friedman 双向秩次方差分析（多相关样本）。<br><u>易错：配对设计用"符号秩和"，独立设计用"秩和"，一个字的差别决定了用哪个公式。</u>|统计::卡方与非参数
<b>#127 ★ 因素分析、聚类分析与判别分析分别解决什么问题？</b>|因素分析：从众多变量中提取潜在的共同因素，用于降维与结构探索；聚类分析：按相似性把对象分类，事先不知道类别；判别分析：已知类别，建立规则对新对象归类预测。<br><u>易错：聚类是"不知道类别去分"，判别是"知道类别去判"——顺序不能颠倒。</u>|统计::卡方与非参数
<b>#128 ★★★ CTT（经典测验理论）的真分数模型是什么？</b>|X＝T＋E（观测分数＝真分数＋误差分数）；方差形式 S_X²＝S_T²＋S_E²。真分数是无数次测量的期望值，不是"真实能力"。<br><u>易错：真分数可望而不可即，只能说"某次观测在真分数附近波动"。</u>|测量::测量理论
<b>#129 ★★★ 经典测验理论的三个基本假设是什么？</b>|① 误差分数的期望值为 0；② 真分数与误差分数相互独立（相关为 0）；③ 各次测量的误差之间相互独立（相关为 0）。<br><u>易错：三个假设缺一不可，信度的整套推导都建立在它们之上；平行测验假设是更强的一条附加假设。</u>|测量::测量理论
<b>#130 ★★★ 信度的定义与真分数表达形式？</b>|信度是一组测量分数的真变异与实得变异之比：r_xx＝S_T²／S_X²＝1－S_E²／S_X²。操作定义为两平行测验分数的相关系数。<br><u>易错：信度是"一组分数"的属性，不是"某个测验"固有的属性——同一测验用于不同团体，信度不同。</u>|测量::测量理论
<b>#131 ★★★ 各种信度系数分别反映什么误差、适用于什么场合？</b>|重测信度（稳定性系数）：反映时间抽样误差，间隔通常 2–4 周，适合稳定的特质；复本信度（等值性系数）：反映题目抽样误差，需两套等价测验；分半信度：反映内部一致性，两半需匹配；同质性信度（KR20、KR21、α）：反映题目间一致性，适合态度与人格量表；评分者信度：反映评分者间差异，用肯德尔 W 或相关。<br><u>易错：速度测验不能用分半信度与同质性信度（后半部分被试往往没做完），这是选择信度类型的第一道判断。</u>|测量::测量理论
<b>#132 ★★★ 分半信度为什么要校正？如何校正？</b>|因为分半后每半只有原测验的一半长度，信度会被低估。用斯皮尔曼—布朗公式校正：r_xx＝2r_hh／(1＋r_hh)，其中 r_hh 为两半分数的相关。<br><u>易错：分半时通常按奇偶题分半，两半须在难度、内容上匹配；校正公式的方向是把"半长信度"放大为"全长信度"。</u>|测量::测量理论
<b>#133 ★★★ 影响信度的因素有哪些？</b>|① 测验长度（越长信度越高）；② 样本的同质性（团体越异质，信度越高）；③ 题目难度（中等难度、分数分布广则信度高）；④ 两次施测的时间间隔（越长越低）；⑤ 测验内容的同质性；⑥ 被试的身心状态与动机。<br><u>易错："团体越同质信度越高"常被记反——同质团体会限制分数全距，反而降低信度。</u>|测量::测量理论
<b>#134 ★★ 测验长度与信度的关系式是什么？</b>|斯皮尔曼—布朗预言公式：r_n＝nr／[1＋(n－1)r]，n 为长度增加的倍数。信度随长度增加而提高，但提高速度递减。<br><u>易错：靠加长测验提高信度有上限，且会带来疲劳与时间成本，不是越长越好。</u>|测量::测量理论
<b>#135 ★★★ 测量标准误的含义与计算？</b>|SE＝S_x·√(1－r_xx)，表示个体观测分数的误差大小，可用于对个人真分数做区间估计（X±1.96SE）。信度越高，测量标准误越小。<br><u>易错：测量标准误是"个体水平"的指标，与"平均数标准误"（团体水平）完全不同，考试常设混淆项。</u>|测量::测量理论
<b>#136 ★ 概化理论相对于经典测验理论的改进在哪里？</b>|用方差分析把误差分解为多个来源（如题目、评分者、时间），通过 G 研究估计各方差成分，再用 D 研究做决策，可同时给出多种信度（不同决策情境下的推广系数）。<br><u>易错：CTT 只有一个笼统的"误差"，概化理论的核心贡献正是把这个误差拆开。</u>|测量::测量理论
<b>#137 ★★ 项目反应理论的基本假设与主要参数是什么？</b>|假设：单维性（测验只测一种特质）与局部独立性。参数：项目难度 b、区分度 a、猜测度 c，用项目特征曲线描述能力与答对概率的关系。<br><u>易错：IRT 的优点是项目参数不受样本影响、能力估计不受测验影响，这是它优于 CTT 的关键。</u>|测量::测量理论
<b>#138 ★★★ 效度的定义与三种类型是什么？</b>|效度指测验能测到所要测的心理特质的程度。三类：内容效度（题目对内容的代表性）、结构效度（是否测到理论构想）、效标关联效度（与外部效标的一致程度）。<br><u>易错：效度是"针对特定用途"的，不存在"这个测验绝对有效"的说法。</u>|测量::效度
<b>#139 ★★ 内容效度如何确定？它适用于什么测验？</b>|方法：专家判断法（最主要）、复本法、再测法、经验法。适用于成就测验与教育测验，因为这类测验有明确的内容范围。<br><u>易错：内容效度没有数量化指标，只能靠逻辑判断；它不适用于人格测验等无明确内容范围的测验。</u>|测量::效度
<b>#140 ★★★ 结构效度（构想效度）如何确定？</b>|① 因素分析（看是否提取出理论假设的因子）；② 与同类测验的会聚效度、与无关测验的区分效度；③ 内部一致性；④ 实验操作（如不同年龄组分数应呈发展性变化）；⑤ 与其他变量的理论关系。<br><u>易错：会聚效度与区分效度必须同时成立，只看会聚不看区分是不完整的证据。</u>|测量::效度
<b>#141 ★★ 效标关联效度分哪两类？区别是什么？</b>|同时效度：测验分数与同时获得的效标的相关（如新测验与已有效测验同时施测）；预测效度：测验分数与将来获得的效标的相关（如高考分数与大学成绩）。<br><u>易错：区别只在"效标获得的时间"，不在测验本身；预测效度的效标必须是一段时间后才可获得的。</u>|测量::效度
<b>#142 ★★★ 信度与效度是什么关系？</b>|信度是效度的必要而非充分条件：信度低必然效度低，但信度高不保证效度高（可能稳定地测错东西）。效度系数受信度限制，效度不大于信度的平方根。提高信度可以提高效度的上限。<br><u>易错：不能写"信度高则效度高"；标准表述是"信度是效度的必要条件"。</u>|测量::效度
<b>#143 ★★ 影响效度的因素有哪些？</b>|测验本身的构成（题目代表性、难度、指导语）；施测情境与标准化程度；被试的动机、焦虑、练习；效标的可靠性；样本的异质性（全距受限会降低效度系数）；统计方法的选择。<br><u>易错：效标本身的信效度差，会"压低"整个测验的效度，这个原因常被忽略。</u>|测量::效度
<b>#144 ★★★ 难度的计算方法有哪几种？</b>|① 通过率法：P＝R／N（答对人数除以总人数），适用于二分计分题；② 平均数法：P＝该题平均得分／满分，适用于多重计分题；③ 极端分组法：P＝(P_H＋P_L)／2。<br><u>易错：难度以"通过率高"表示"容易"，不要写成"难度高＝容易"，方向最容易反。</u>|测量::项目分析
<b>#145 ★★ 难度的等距量表如何转换？</b>|Δ＝13＋4z，其中 z 为通过率 P 对应的正态曲线下标准分数。把 P 转为 z 再加变换，使难度指标具有等距性质，便于比较不同题目的难易差距。<br><u>易错：P 值本身只是顺序变量（0.5 与 0.6 的差距不等于 0.8 与 0.9 的差距），故需转等距量表。</u>|测量::项目分析
<b>#146 ★★★ 区分度的计算方法与评价标准？</b>|① 极端分组法：D＝P_H－P_L（高分组通过率减低分组通过率，高低分组各取 27%）；② 相关法：用点二列相关、二列相关或 φ 相关。评价：D≥0.40 很好，0.30–0.39 良好，0.20–0.29 尚可需修改，＜0.19 应淘汰。<br><u>易错：为什么取 27%？因为此时两组差异最大且样本足够，这是统计上求出的最优比例，不是随意的规定。</u>|测量::项目分析
<b>#147 ★★★ 难度与区分度是什么关系？</b>|当题目难度接近 0.50 时区分度最大（理论上）；难度过高（P→0）或过低（P→1）时，所有人都答错或答对，区分度趋于 0。因此要提高区分度，题目难度应集中在中等水平。<br><u>易错："P＝0.5 区分度最大"的前提是被试能力呈正态分布；若团体能力分布偏斜，最优点会偏移。</u>|测量::项目分析
<b>#148 ★★ 测验的难度分布应如何安排？</b>|常模参照测验：难度中等、分布范围广，以扩大分数全距、提高信度与区分度；标准参照测验：难度依教学目标定，不必追求中等，重点是覆盖内容。<br><u>易错：两类测验的难度原则不同，答题时要先判断是常模参照还是标准参照。</u>|测量::项目分析
<b>#149 ★ 猜测的校正公式是什么？</b>|S＝R－W／(K－1)，其中 R 为答对数、W 为答错数、K 为选项数。校正后 P＝S／N。用于多重选择题，以扣除猜对带来的虚高分。<br><u>易错：校正会降低低分组得分更多，因此可能提高区分度；但现代测验多不采用校正，因为鼓励猜测更符合测量要求。</u>|测量::项目分析
<b>#150 ★★ 测验编制的基本程序是什么？</b>|确定测验目的→拟定编制计划（编双向细目表）→编写题目→预测与项目分析→合成测验并标准化→编写指导书→收集信效度资料→修订。<br><u>易错：项目分析必须在"预测"之后、正式合成之前进行，顺序颠倒会导致题目未经筛选就进入正式测验。</u>|测量::编制与分数解释
<b>#151 ★★★ 常模有哪几种类型？</b>|① 发展常模：年龄常模、年级常模；② 组内常模：百分等级常模、标准分数常模（z、T、离差智商、标准九）；③ 商数（如教育商数、成就商数）。常模是解释分数的参照标准，不是"标准答案"。<br><u>易错：常模具有时间与团体局限性，旧常模会使分数解释失真，需定期修订。</u>|测量::编制与分数解释
<b>#152 ★★★ 常模参照测验与标准参照测验有什么区别？</b>|常模参照：与他人比较，看相对位置，分数全距要大、难度中等分布广，用于选拔；标准参照：与绝对标准比较，看是否达标，强调内容覆盖面，用于教学评估与资格考试。<br><u>易错：标准参照测验不必追求区分度与中等难度；用常模参照的标准去评价标准参照测验是常见误判。</u>|测量::编制与分数解释
<b>#153 ★★ 百分等级与标准分数各有什么优缺点？</b>|百分等级（PR）：易懂，但属于顺序量表，单位不等，不能加减；标准分数（z、T＝10z＋50、离差智商＝15z＋100、标准九）：等距、可运算，但需以正态分布为前提。<br><u>易错：百分等级不能求平均、不能做加减——"单位不等"是它最致命的缺陷。</u>|测量::编制与分数解释
<b>#154 ★ 测验等值的含义与常用设计？</b>|使不同版本测验的分数可以互相换算比较。常用设计：单组设计、等组设计（随机等组）、锚测验设计（共同题连接两套测验）。<br><u>易错：等值的前提是两测验测的是同一特质、同一水平，测不同构念的测验无法等值。</u>|测量::编制与分数解释
<b>#155 ★★ 测验标准化的三方面内容是什么？</b>|① 内容标准化（题目、指导语统一）；② 施测标准化（情境、时限、评分规则统一）；③ 分数解释标准化（建立常模）。<br><u>易错：只把"施测过程统一"当成标准化是不完整的，没有常模就无法解释分数。</u>|测量::编制与分数解释
<b>#156 ★★★ 智力测验的四个里程碑分别是谁、做了什么？</b>|比奈与西蒙（1905）编制世界上第一个智力量表；推孟（1916）修订为斯坦福—比奈量表，引入比率智商；韦克斯勒（1939）采用离差智商，分言语与操作两部分；瑞文（1938）编制非文字推理测验，可跨文化、可团体施测。<br><u>易错：比奈量表最初目的是筛选需要特殊教育的儿童，不是测量"天才"。</u>|测量::常用测验
<b>#157 ★★★ 比率智商与离差智商分别如何计算？为什么改用离差智商？</b>|比率智商 IQ＝(心理年龄／实际年龄)×100；离差智商以同年龄组为参照，平均数 100、标准差 15。改用离差智商是因为成人心理年龄不再随年龄增长，比率智商会失真。<br><u>易错：斯坦福—比奈后期也改用离差智商（标准差 16），与韦氏的 15 不同，注意区分。</u>|测量::常用测验
<b>#158 ★★★ MMPI 的结构与效度量表是什么？</b>|明尼苏达多项人格问卷，共 566 题（常用 399 题版本），含 10 个临床量表与 4 个效度量表：Q（不能回答）、L（说谎）、F（诈病）、K（校正）。采用 T 分数解释。<br><u>易错：L、F、K 是效度量表而非临床量表；MMPI 属自陈量表，不是投射测验。</u>|测量::常用测验
<b>#159 ★★★ 16PF 与 EPQ 分别测什么？各含哪些维度？</b>|16PF（卡特尔）：187 题，测 16 个根源特质；EPQ（艾森克）：测 E（内外倾）、N（神经质）、P（精神病质）三个维度，另有 L 为效度量表（掩饰性）。<br><u>易错：EPQ 的 L 是效度量表，不是人格维度——这是选择题的高频陷阱。</u>|测量::常用测验
<b>#160 ★★ 投射测验的代表工具与优缺点是什么？</b>|代表：罗夏墨迹测验、主题统觉测验（TAT）、房树人、词语联想、句子完成。优点：能探测无意识内容、被试难以伪装；缺点：信效度偏低、计分与解释主观、对主试要求高。<br><u>易错：投射测验的主要弱点是信效度，不要答成"不能团体施测"。</u>|测量::常用测验
<b>#161 ★ SCL-90、SDS、SAS 分别是什么量表？</b>|SCL-90（症状自评量表）：90 个项目、9 个因子，1–5 级评分，用于心理健康筛查；SDS（自评抑郁量表）与 SAS（自评焦虑量表）：各 20 题，用于抑郁与焦虑的自评筛查，不作诊断用。<br><u>易错：这些是筛查工具，不能作为临床诊断依据，这是伦理与解释上的硬性限制。</u>|测量::常用测验
<b>#162 ★ 使用心理测验时的伦理要求有哪些？</b>|① 由有资格者使用；② 保护被试隐私与保密；③ 事先取得知情同意；④ 不滥用、不超出测验的适用范围解释；⑤ 分数解释须谨慎，避免标签化。<br><u>易错：测验结果只能由专业人员解释，不能把原始分数直接交给被试"自己看"。</u>|测量::常用测验

/* 反转义（最多四层） */
function unesc(s){
  s = String(s||'');
  for (let i=0;i<4;i++){
    const t = s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
               .replace(/&#39;/g,"'").replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
    if (t === s) break;
    s = t;
  }
  return s;
}
/* 清洗行内 HTML：只保留 b/i/u/br */
function cleanInline(html){
  const src = unesc(html); let out = '';
  const re = /<\/?([a-zA-Z]+)[^>]*>|([^<]+)/g;
  const allow = {b:1,strong:1,i:1,em:1,u:1,sub:1,sup:1}; let m;
  while ((m = re.exec(src))){
    if (m[2] !== undefined){ out += esc(m[2]); continue; }
    const tag = m[1].toLowerCase(), closing = m[0][1] === '/';
    if (tag === 'br'){ if (!closing) out += '<br>'; continue; }
    if (!allow[tag]) continue;
    const t = tag === 'strong' ? 'b' : tag === 'em' ? 'i' : tag;
    out += closing ? '</'+t+'>' : '<'+t+'>';
  }
  return out.replace(/<b>\s+/g,'<b>').replace(/\s+<\/b>/g,'</b>').replace(/(<br>\s*)+$/,'').trim();
}
/* 取纯文本 */
function plain(h){
  let s = String(h||'');
  for (let i=0;i<4;i++){
    const t = unesc(s.replace(/<[^>]*>/g,''));
    if (t === s) break;
    s = t;
  }
  return s.trim();
}
/* 判重用的归一化键：只留中英文数字 */
function key(h){

}
function extractStar(q){
  const m = String(q).match(/★+/);
  return { star: m ? Math.min(3, m[0].length) : 0, q: String(q).replace(/★+/g,'') };
}
function extractCode(q){
  const m = String(q).match(/^\s*#\s*([A-Za-z0-9\-]{1,12})\s*/);
  return m ? { code: m[1], q: String(q).slice(m[0].length) } : { code:'', q:String(q) };
}

function guessIndex(q, a, tags){

  for (const r of TYPE_RULES) if (r[1].test(qT)){ type = r[0]; break; }

}

  const k = todayKey();
  if (!state.today || state.today.date !== k)
    state.today = { date:k, newCount:0, reviewed:0, seconds:0 };
  if (!Number.isFinite(state.today.seconds)) state.today.seconds = 0;
}
function sanitizeCard(o){
  if (!o || typeof o.q !== 'string' || typeof o.a !== 'string') return null;
  const q = cleanInline(String(o.q).slice(0,LIM_Q));
  const a = cleanInline(String(o.a).slice(0,LIM_A));
  if (!plain(q) || !plain(a)) return null;
  let idx = null;
  if (Array.isArray(o.idx) && o.idx.length === 3) idx = o.idx.map(x => String(x).slice(0,20));
  return {
    id: (typeof o.id === 'string' && o.id) ? o.id : uid(),
    q:q, a:a, tip: cleanInline(String(o.tip||'').slice(0,LIM_T)),
    code: typeof o.code === 'string' ? o.code.slice(0,12) : '',
    refs: Array.isArray(o.refs) ? o.refs.slice(0,6).map(x => String(x).slice(0,12)) : [],
    tags: Array.isArray(o.tags) ? o.tags.slice(0,8).map(x => String(x).slice(0,24)) : [],
    star: Number.isInteger(o.star) ? clamp(o.star,0,3) : 0,
    mark: !!o.mark,
    idx: idx, idxAuto: !!o.idxAuto,
    stage: Number.isInteger(o.stage) ? clamp(o.stage,0,STAGE_MAX) : 0,
    due: Number.isFinite(o.due) ? o.due : 0,
    reps: Number.isFinite(o.reps) ? Math.max(0,Math.floor(o.reps)) : 0,
    lapses: Number.isFinite(o.lapses) ? Math.max(0,Math.floor(o.lapses)) : 0,
    created: Number.isFinite(o.created) ? o.created : now(),
    lastAt: Number.isFinite(o.lastAt) ? o.lastAt : 0
  };
}
function normalizeAll(){
  let n = 0;
  for (const c of state.cards){
    const q = cleanInline(c.q), a = cleanInline(c.a), t = cleanInline(c.tip);
    if (q !== c.q || a !== c.a || t !== c.tip){ c.q=q; c.a=a; c.tip=t; n++; }
  }
  return n;
}

/* 解析题库文本 */
function parseSource(text, autoCode){
  const out = [];
  const lines = String(text).split(/\r?\n/);
  let seq = 0;
  for (let i = 0; i < lines.length; i++){
    const line = lines[i].trim();
    if (!line || /^(<br\s*\/?>|\/\/)$/i.test(line)) continue;
    let qRaw, aRaw, meta = '';
    if (line.indexOf('|') > -1){
      const parts = line.split('|');
      if (parts.length >= 3 && /::/.test(parts[parts.length-1])) meta = parts.pop();
      qRaw = parts[0] || ''; aRaw = parts.slice(1).join('|');
    } else if (line.indexOf('\t') > -1){
      const parts = line.split('\t');
      qRaw = parts[0]; aRaw = parts[1] || ''; if (parts[2]) meta = parts[2];
    } else continue;

    const st = extractStar(qRaw);
    const aClean = cleanInline(aRaw);
    const segs = aClean.split(/<br\s*\/?>/i);
    const main = [], tip = [];
    segs.forEach((s,k) => {
      if (k > 0 && /^\s*(易错|注意|提示|误区|考点|辨析)/.test(plain(s))) tip.push(s);
      else main.push(s);
    });
    const tags = meta ? meta.split('::').map(x => x.trim()).filter(Boolean) : [];
    const cd = extractCode(plain(st.q));
    let qNoCode = st.q;
    if (cd.code){
      const at = qNoCode.indexOf('#' + cd.code);
      if (at > -1) qNoCode = qNoCode.slice(0, at) + qNoCode.slice(at + cd.code.length + 1);
    }
    let qc = cleanInline(qNoCode);
    seq++;
    const aa = main.join('<br>');
    const c = sanitizeCard({
      q: qc, a: aa, tip: tip.join('<br>'), tags: tags, star: st.star,
      code: autoCode ? ('T'+String(seq).padStart(3,'0')) : cd.code,
      idx: chapterIndex(qc, aa, tags), idxAuto: true
    });
    if (c) out.push(c);
  }
  return { cards: out };
}

let seedCache = null;
function seedParsed(){
  if (seedCache) return seedCache;
  seedCache = parseSource(SEED_SOURCE, false);
  return seedCache;
}

/* 存储 */
let saveTimer = null, saveDirty = false;
function save(){ saveDirty = true; if (!saveTimer) saveTimer = setTimeout(flushSave, 400); }
function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  if (!saveDirty) return;
  saveDirty = false;
  try {
    localStorage.setItem(KEY, JSON.stringify({ v:1, cards:state.cards, seeded:state.seeded,
      seedVer:state.seedVer, idxVer:state.idxVer, codeVer:state.codeVer,
      settings:state.settings, today:state.today,
      history:state.history, timerPaused:!!state.timerPaused }));
  } catch(e){ toast('保存失败：空间不足，请先导出备份'); }
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || !Array.isArray(o.cards)) return false;
    const arr = [];
    for (const it of o.cards){ const c = sanitizeCard(it); if (c) arr.push(c); }
    if (!arr.length && !o.seeded) return false;
    state.cards = arr;
    state.seeded = !!o.seeded;
    state.seedVer = Number(o.seedVer) || 0;
    state.idxVer = Number(o.idxVer) || 0;
    state.codeVer = Number(o.codeVer) || 0;
    const st = o.settings || {};
    state.settings = { dailyNew: clamp(Number(st.dailyNew) || 100, 0, 1000),
      mode: st.mode === 'cram' ? 'cram' : 'srs' };
    if (o.today && o.today.date === todayKey()){
      state.today = { date:o.today.date, newCount:Number(o.today.newCount)||0,
        reviewed:Number(o.today.reviewed)||0, seconds:Number(o.today.seconds)||0 };
    }
    if (o.history && typeof o.history === 'object' && !Array.isArray(o.history)) state.history = o.history;
    state.timerPaused = !!o.timerPaused;
    return true;
  } catch(e){ return false; }
}
function mergeSeed(){
  const p = seedParsed();
  const have = new Set(state.cards.map(c => key(c.q)));
  let added = 0;
  for (const c of p.cards){
    const k = key(c.q);
    if (!k || have.has(k)) continue;
    if (state.cards.length >= MAX_CARDS) break;
    state.cards.push(JSON.parse(JSON.stringify(c)));
    have.add(k); added++;
  }
  state.seeded = true;
  state.seedVer = APP.seedVer;
  return added;
}
function applyIndexMigration(){
  let n = 0;
  for (const c of state.cards){
    if (c.idxAuto === false) continue;
    const g = chapterIndex(c.q, c.a, c.tags);
    if (!c.idx || c.idx.join('|') !== g.join('|')){ c.idx = g; c.idxAuto = true; n++; }
  }
  state.idxVer = 1;
  return n;
}
function reindexAuto(){
  let n = 0;
  for (const c of state.cards){
    if (c.idxAuto === false) continue;
    const g = chapterIndex(c.q, c.a, c.tags);
    if (!c.idx || c.idx.join('|') !== g.join('|')){ c.idx = g; n++; }
  }
  return n;
}

/* 查重 */
function findDupes(){
  const m = new Map();
  for (const c of state.cards){
    const k = key(c.q);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(c);
  }
  const out = [];
  m.forEach(arr => { if (arr.length > 1) out.push(arr); });
  return out;
}
function dedupe(){
  const groups = findDupes();
  let removed = 0;
  for (const g of groups){
    g.sort((a,b) => (b.reps-a.reps) || (b.stage-a.stage) ||
      ((b.mark?1:0)-(a.mark?1:0)) || (b.star-a.star));
    const keep = g[0];
    for (const c of g.slice(1)){
      if (c.mark) keep.mark = true;
      if (c.star > keep.star) keep.star = c.star;
      if (!keep.code && c.code) keep.code = c.code;
      keep.refs = Array.from(new Set((keep.refs||[]).concat(c.refs||[]))).slice(0,6);
      const i = state.cards.indexOf(c);
      if (i > -1){ state.cards.splice(i,1); removed++; }
    }
  }
  return removed;
}

/* 计时 */
let timerHandle = null;
function startTimer(){
  if (timerHandle) return;
  timerHandle = setInterval(() => {
    if (document.hidden || curTab !== 'review' || state.timerPaused) return;
    ensureToday();
    state.today.seconds = (state.today.seconds || 0) + 1;
    logDay();
    paintTime();
    if (state.today.seconds % 20 === 0) save();
  }, 1000);
}
function paintTime(){
  ensureToday();
  const t = mmss(state.today.seconds);
  const mode = state.settings.mode === 'cram' ? '突击模式' : APP.sub;
  if (D('hintSub')) D('hintSub').textContent = mode + ' · ' + state.cards.length + ' 张 · 今日 ' + t;
  if (D('cramTime')) D('cramTime').textContent = t;
}

/* 计数与队列 */
function counts(){
  ensureToday();
  const end = endOfToday();
  let due = 0, fresh = 0;
  for (const c of state.cards){
    if (c.reps === 0) fresh++;
    else if (c.due <= end) due++;
  }
  const quota = Math.max(0, state.settings.dailyNew - state.today.newCount);
  return { due:due, fresh:fresh, quota:quota };
}
const markedCount = () => state.cards.filter(c => c.mark).length;
function buildList(){
  ensureToday();
  const end = endOfToday();
  const due = state.cards.filter(c => c.reps > 0 && c.due <= end)
    .sort((a,b) => (b.star-a.star) || (a.due-b.due) || (a.stage-b.stage));
  const quota = Math.max(0, state.settings.dailyNew - state.today.newCount);
  const fresh = state.cards.filter(c => c.reps === 0).slice(0, quota);
  return due.concat(fresh).map(c => c.id);
}

/* 复习会话 */
let session = { list:[], pos:0, revealed:false, hist:{}, fin:{}, orig:{}, custom:false };
const getCard = id => state.cards.find(c => c.id === id);
const getByCode = code => state.cards.find(c => c.code === code);
const curCard = () => getCard(session.list[session.pos]);
function newSession(ids){
  session = { list:ids.slice(), pos:0, revealed:false, hist:{}, fin:{}, orig:{}, custom:false };
}
function finalTally(){
  const d = { f:0, o:0, e:0 };
  for (const k in session.fin){ const v = session.fin[k]; if (d[v] !== undefined) d[v]++; }
  return d;
}
function skipFinal(from){
  let i = from;
  while (i < session.list.length && session.fin[session.list[i]]) i++;
  return i;
}
function grade(kind){
  const c = curCard();
  if (!c) return;
  ensureToday();
  if (!session.orig[c.id])
    session.orig[c.id] = { stage:c.stage, due:c.due, reps:c.reps, lapses:c.lapses };
  const o = session.orig[c.id];
  if (!session.hist[c.id]) session.hist[c.id] = [];
  const h = session.hist[c.id];

  c.stage = o.stage; c.due = o.due; c.reps = o.reps; c.lapses = o.lapses;

  const t = now();
  if (kind === 'f'){ c.stage = 0; c.due = t; c.lapses++; c.reps++; }
  else {
    const step = kind === 'e' ? 2 : 1;
    c.stage = clamp(c.stage + step, 0, STAGE_MAX);
    c.due = t + INTERVALS[c.stage] * DAY;
    c.reps++;
  }
  c.lastAt = t;
  h.push(kind);

  if (h.length === 1){
    if (o.reps === 0) state.today.newCount++;
    state.today.reviewed++;
    logDay();
  }

  const fc = h.filter(x => x === 'f').length;
  if (kind === 'f' && fc < 3){
    session.list.push(c.id);
    delete session.fin[c.id];
  } else {
    session.fin[c.id] = kind;
  }

  Sound.tap(kind);
  session.revealed = false;
  session.pos = skipFinal(session.pos + 1);
  save(); render(); renderHeader(); renderBadge();
}
function goPrev(){
  if (state.settings.mode === 'cram'){
    if (cram.pos > 0){ cram.pos--; cram.revealed = false; render(); }
  } else if (session.pos > 0){ session.pos--; session.revealed = false; render(); }
}
function goNext(){
  if (state.settings.mode === 'cram'){
    if (cram.pos < cram.list.length - 1){ cram.pos++; cram.revealed = false; render(); }
  } else if (session.pos < session.list.length - 1){ session.pos++; session.revealed = false; render(); }
}

/* 突击模式 */
let cram = { list:[], pos:0, revealed:false, doneSet:{}, unknownSet:{}, retry:{} };
function cramSave(){
  try {
    localStorage.setItem(CRAM_KEY, JSON.stringify({ l:cram.list, p:cram.pos,
      d:cram.doneSet, u:cram.unknownSet, r:cram.retry }));
  } catch(e){}
}
let cramT = null;
function cramSaveSoon(){
  if (cramT) return;
  cramT = setTimeout(() => { cramT = null; cramSave(); }, 400);
}
function cramLoad(){
  try {
    const raw = localStorage.getItem(CRAM_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    cram.list = Array.isArray(o.l) ? o.l.filter(id => getCard(id)) : [];
    cram.pos = Number(o.p) || 0;
    if (cram.pos > cram.list.length) cram.pos = cram.list.length;
    cram.doneSet = (o.d && typeof o.d === 'object') ? o.d : {};
    cram.unknownSet = (o.u && typeof o.u === 'object') ? o.u : {};
    cram.retry = (o.r && typeof o.r === 'object') ? o.r : {};
  } catch(e){}
}
function cramStart(fresh){
  if (fresh || !cram.list.length){
    cram.list = state.cards.slice().sort((a,b) => b.star-a.star).map(c => c.id);
    cram.pos = 0; cram.revealed = false;
    cram.doneSet = {}; cram.unknownSet = {}; cram.retry = {};
    cramSave();
  }
}
const cramCur = () => getCard(cram.list[cram.pos]);
function cramGrade(kind){
  const c = cramCur();
  if (!c) return;
  if (kind === 'k'){ cram.doneSet[c.id] = 1; delete cram.unknownSet[c.id]; }
  else {
    cram.unknownSet[c.id] = 1; delete cram.doneSet[c.id];
    const n = cram.retry[c.id] || 0;
    if (n < 2){ cram.retry[c.id] = n + 1; cram.list.push(c.id); }
  }
  cram.revealed = false;
  cram.pos++;
  Sound.tap(kind === 'k' ? 'o' : 'f');
  cramSaveSoon(); render(); renderHeader(); renderBadge();
}
function cramToSRS(){
  const set = new Set(Object.keys(cram.unknownSet));
  const picked = state.cards.filter(c => set.has(c.id));
  for (const c of picked){ c.stage = 0; c.reps = 0; c.due = 0; }
  state.cards = picked.concat(state.cards.filter(c => !set.has(c.id)));
  cram.list = []; cram.pos = 0; cram.doneSet = {}; cram.unknownSet = {}; cram.retry = {};
  cramSave();
  state.settings.mode = 'srs';
  newSession([]);
  saveDirty = true; flushSave(); renderAll();
  toast('已把 ' + picked.length + ' 张转入间隔复习');
}

/* 音效 */
const Sound = (function(){
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, master = null;
  function init(){
    if (ctx || !AC) return ctx;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.4; master.connect(ctx.destination);
    } catch(e){ ctx = null; }
    return ctx;
  }
  function blip(f, dur, gain, type, t){
    if (!init()) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
    const t0 = ctx.currentTime + (t || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  return {
    unlock(){ const c = init(); if (c && c.state === 'suspended') { try { c.resume(); } catch(e){} } },
    flip(){ blip(880, 0.09, 0.10); blip(1320, 0.08, 0.05, 'sine', 0.04); },
    tap(k){
      if (k === 'f'){ blip(300, 0.14, 0.10, 'triangle'); blip(220, 0.18, 0.07, 'sine', 0.05); }
      else if (k === 'o'){ blip(660, 0.12, 0.11); blip(990, 0.14, 0.06, 'sine', 0.05); }
      else { blip(784, 0.10, 0.10); blip(1046, 0.12, 0.08, 'sine', 0.05); blip(1568, 0.16, 0.05, 'sine', 0.10); }
    }
  };
})();

const GL = { f:'忘了', o:'一般', e:'很熟' };

function renderHeader(){

      + '，今日累计 ' + mmss(state.today.seconds) + '。</p>'

  const done = Object.keys(session.fin).length;
  const g = session.fin[c.id];
  let h = navHTML(done, uniq, session.pos <= 0, session.pos >= session.list.length - 1);

    h += '<button class="revealbtn" id="reveal">显示答案</button>';
  } else if (g){
    h += '<div class="gradednote">本轮已评为「' + GL[g] + '」· 点同档位可重评</div>'

      + '</div>';

      + '<button class="gbtn f" data-g="f">忘了<small>稍后再来</small></button>'

function renderCram(){
  const wrap = D('cardwrap'), bar = D('gradebar');
  if (!state.cards.length){
    wrap.innerHTML = '<div class="state"><div class="big">▤</div><h2>还没有卡片</h2>'
      + '<div class="row"><button class="pbtn pri" id="goCards">去卡片库</button></div></div>';
    bar.innerHTML = '';
    if (D('goCards')) D('goCards').onclick = () => switchTab('cards');
    return;
  }
  if (!cram.list.length) cramStart(true);

  const total = state.cards.length;
  const done = Object.keys(cram.doneSet).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const head = '<div class="progline"><span>已认 ' + done + ' / ' + total + '</span>'
    + '<span class="progbar"><b style="width:' + pct + '%"></b></span>'
    + '<span id="cramTime">' + mmss(state.today.seconds) + '</span></div>';

  if (cram.pos >= cram.list.length){
    const unk = Object.keys(cram.unknownSet).length;
    wrap.innerHTML = head + '<div class="state"><div class="big">✦</div><h2>全部过完了</h2>'
      + '<p>共 ' + total + ' 张，其中标记「不认识」的 <b>' + unk + ' 张</b>。</p>'
      + '<div class="row"><button class="pbtn pri" id="cToSrs">转入间隔复习（' + unk + '）</button>'
      + '<button class="pbtn" id="cBack">回到第一张</button>'
      + '<button class="pbtn" id="cRestart">重头再突击</button></div></div>';
    bar.innerHTML = '';
    if (D('cToSrs')) D('cToSrs').onclick = cramToSRS;
    if (D('cBack')) D('cBack').onclick = () => { cram.pos = 0; cram.revealed = false; render(); };
    if (D('cRestart')) D('cRestart').onclick = () => { cramStart(true); renderAll(); };
    return;
  }

  const c = cramCur();
  if (!c){ cram.pos++; return renderCram(); }

  wrap.innerHTML = head + cardHTML(c, cram.revealed);
  wrap.scrollTop = 0;

  let h = navHTML(done, total, cram.pos <= 0, cram.pos >= cram.list.length - 1);
  if (!cram.revealed){
    h += '<button class="revealbtn" id="reveal">显示答案</button>';
  } else {
    h += '<div class="grades two">'
      + '<button class="gbtn f" data-g="n">不认识<small>稍后再来</small></button>'
      + '<button class="gbtn o" data-g="k">认识<small>标记通过</small></button></div>';
  }
  bar.innerHTML = h;
  bindNav();
  const fn = () => { cram.revealed = true; Sound.unlock(); Sound.flip(); renderCram(); };
  if (D('reveal')) D('reveal').onclick = fn;
  bindCard(c, cram.revealed ? null : fn);
  bar.querySelectorAll('[data-g]').forEach(b => {
    b.onclick = () => cramGrade(b.dataset.g === 'k' ? 'k' : 'n');
  });
}

function bindCard(c, revealFn){
  const qc = D('qcard');
  if (qc) qc.onclick = e => {
    const r = e.target.closest ? e.target.closest('[data-ref]') : null;
    if (r){
      e.stopPropagation();
      const t = getByCode(r.dataset.ref);
      if (t) openEditor(t.id); else toast('找不到卡片 ' + r.dataset.ref);
      return;
    }
    if (revealFn) revealFn();
  };
  const mb = D('markBtn');
  if (mb) mb.onclick = e => { e.stopPropagation(); toggleMark(c); };
}
function toggleMark(c){
  if (!c) return;
  c.mark = !c.mark;
  save(); render(); renderHeader();
  if (navigator.vibrate) navigator.vibrate(10);
  toast(c.mark ? '已加入个人标记' : '已取消标记');
}
function cardHTML(c, revealed){
  let tags = '<div class="tagrow">';
  if (c.star) tags += '<span class="tag star" style="' + STAR_STYLE[c.star] + '">'
    + '★★★'.slice(0, c.star) + '</span>';
  if (c.code) tags += '<span class="tag code">#' + esc(c.code) + '</span>';
  if (c.tags && c.tags.length){
    tags += '<span class="tag" style="' + tagStyle(lastTag(c)) + '">' + esc(lastTag(c)) + '</span>';
    c.tags.slice(0, -1).forEach(t => { tags += '<span class="tag ghost">' + esc(t) + '</span>'; });
  }
  if (state.settings.mode === 'srs') tags += '<span class="tag ghost">第 ' + c.stage + ' 阶</span>';
  tags += '<button class="markbtn' + (c.mark ? ' on' : '') + '" id="markBtn">⚑</button></div>';

    ? '<div class="idxline"><b>' + esc(c.idx[0]) + '</b> › ' + esc(c.idx[1]) + ' › ' + esc(c.idx[2]) + '</div>'
    : '';

    + tags + idx + '<div class="qtext">' + c.q + '</div>';
