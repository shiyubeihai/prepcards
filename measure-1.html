    + tree.size + ' 个学科，' + Array.from(tree.values()).reduce((s,m) => s + m.size, 0) + ' 个科目'
    + (auto ? '，其中 <b>' + auto + '</b> 张索引自动判断' : '') + '</div>';

  tree.forEach((m2, l1) => {
    let n1 = 0;
    m2.forEach(m3 => { m3.forEach(v => { n1 += v; }); });
    const open1 = idxOpen.has(l1);
    h += '<div class="idxrow l1" data-nv="1" data-k="' + esc(l1) + '">'
      + '<span class="idxarrow">' + (open1 ? '▾' : '▸') + '</span>'
      + '<span class="idxname">' + esc(l1) + '</span><span class="idxcnt">' + n1 + '</span></div>';
    if (!open1) return;
    m2.forEach((m3, l2) => {
      const key2 = l1 + '/' + l2;
      let n2 = 0;
      m3.forEach(v => { n2 += v; });
      const open2 = idxOpen.has(key2);
      h += '<div class="idxrow l2" data-nv="2" data-v="' + esc(key2) + '">'
        + '<span class="idxarrow">' + (open2 ? '▾' : '▸') + '</span>'
        + '<span class="idxname">' + esc(l2) + '</span><span class="idxcnt">' + n2 + '</span></div>';
      if (!open2) return;
      m3.forEach((n3, l3) => {
        h += '<div class="idxrow l3" data-nv="3" data-v=\'' + esc(JSON.stringify([l1, l2, l3])) + '\'>'
          + '<span class="idxarrow">›</span><span class="idxname">' + esc(l3) + '</span>'
          + '<span class="idxcnt">' + n3 + '</span></div>';
      });
    });
  });
  h += '<div class="idxtip">点第三层进入卡片库筛选；<b>长按</b>科目可看该科目全部卡片。</div>';
  box.innerHTML = h;

  box.querySelectorAll('.idxrow').forEach(el => {
    const lv = el.dataset.nv;
    if (lv === '1'){
      const kk = el.dataset.k;
      el.onclick = () => { idxOpen.has(kk) ? idxOpen.delete(kk) : idxOpen.add(kk); renderIndex(); };
    } else if (lv === '2'){
      const kk = el.dataset.v, path = kk.split('/');
      let timer = null;
      el.onclick = () => {
        if (timer){ clearTimeout(timer); timer = null; return; }
        idxOpen.has(kk) ? idxOpen.delete(kk) : idxOpen.add(kk); renderIndex();
      };
      el.addEventListener('pointerdown', () => {
        timer = setTimeout(() => {
          timer = null;
          filter = { kind:'idx', val:path }; shown = 50;
          switchTab('cards'); renderChips(); renderList();
        }, 520);
      });
      ['pointerup','pointercancel','pointerleave'].forEach(ev => {
        el.addEventListener(ev, () => { if (timer){ clearTimeout(timer); timer = null; } });
      });
    } else {
      el.onclick = () => {
        try { filter = { kind:'idx', val:JSON.parse(el.dataset.v) }; } catch(e){ return; }
        shown = 50; switchTab('cards'); renderChips(); renderList();
      };
    }
  });
}

/* 编辑器 */
let editingId = null, editStar = 0, editMark = false;
let editIdx = [TOP, SUBJECTS[0], TYPES[0]];
function renderIdxPick(){
  const mk = (arr, cur, lv) => arr.map(v =>
    '<button class="opt' + (v === cur ? ' on' : '') + '" data-lv="' + lv + '" data-v="' + esc(v) + '">'
    + esc(v) + '</button>').join('');
  D('edIdx1').innerHTML = mk([TOP], editIdx[0], 0);
  D('edIdx2').innerHTML = mk(SUBJECTS, editIdx[1], 1);
  D('edIdx3').innerHTML = mk(TYPES, editIdx[2], 2);
  D('edIdxHint').textContent = editIdx.join(' › ');
}
function paintStar(){
  D('edStar').querySelectorAll('[data-s]').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.s) === editStar);
  });
}
function paintMark(){
  D('edMark').querySelectorAll('[data-mk]').forEach(b => {
    b.classList.toggle('on', (b.dataset.mk === '1') === editMark);
  });
}
function updateCounts(){
  const set = (el, n, lim) => { el.textContent = n + ' / ' + lim; el.classList.toggle('over', n > lim); };
  set(D('cntQ'), D('edQ').value.length, LIM_Q);
  set(D('cntA'), D('edA').value.length, LIM_A);
  set(D('cntT'), D('edT').value.length, LIM_T);
}
function openEditor(id){
  editingId = id || null;
  const c = id ? getCard(id) : null;
  D('edTitle').textContent = c ? '编辑卡片' : '新建卡片';
  D('edStage').textContent = c ? ('第 ' + c.stage + ' 阶 · 已复习 ' + c.reps + ' 次')
    : ('剩余可添加 ' + Math.max(0, MAX_CARDS - state.cards.length) + ' 张');
  D('edQ').value = c ? plain(c.q) : '';
  D('edA').value = c ? plain(c.a).replace(/<br>/g, '\n') : '';
  D('edT').value = c ? plain(c.tip) : '';
  D('edG').value = c ? (c.tags || []).join('::') : (SUBJECTS[0] ? '' : '');
  D('edCode').value = c ? c.code : '';
  D('edRefs').value = (c && c.refs) ? c.refs.join(', ') : '';
  editStar = c ? c.star : 0;
  editMark = c ? !!c.mark : false;
  editIdx = (c && c.idx && c.idx.length === 3) ? c.idx.slice() : [TOP, SUBJECTS[0], TYPES[0]];
  paintStar(); paintMark(); renderIdxPick(); updateCounts();
  D('edDel').hidden = !c;
  D('maskEdit').hidden = false;
}
D('edStar').onclick = e => {
  const b = e.target.closest ? e.target.closest('[data-s]') : null;
  if (!b) return;
  editStar = Number(b.dataset.s); paintStar();
};
D('edMark').onclick = e => {
  const b = e.target.closest ? e.target.closest('[data-mk]') : null;
  if (!b) return;
  editMark = b.dataset.mk === '1'; paintMark();
};
['edIdx1','edIdx2','edIdx3'].forEach(id => {
  D(id).onclick = e => {
    const b = e.target.closest ? e.target.closest('[data-lv]') : null;
    if (!b) return;
    editIdx[Number(b.dataset.lv)] = b.dataset.v; renderIdxPick();
  };
});
D('edIdxGuess').onclick = () => {
  editIdx = guessIndex(D('edQ').value, D('edA').value, D('edG').value.split('::'));
  renderIdxPick(); toast('已按内容判断，可再手改');
};
['edQ','edA','edT'].forEach(id => { D(id).addEventListener('input', updateCounts); });

D('edSave').onclick = () => {
  const q = cleanInline(D('edQ').value.replace(/\n/g, '<br>'));
  const a = cleanInline(D('edA').value.replace(/\n/g, '<br>'));
  const tip = cleanInline(D('edT').value.replace(/\n/g, '<br>'));
  const tags = D('edG').value.split('::').map(s => s.trim()).filter(Boolean);
  const code = D('edCode').value.trim().replace(/^#/, '').toUpperCase().slice(0, 12);
  const refs = D('edRefs').value.split(/[,，\s]+/)
    .map(s => s.replace(/^#/,'').toUpperCase()).filter(Boolean).slice(0, 6);
  if (!plain(q)){ toast('问题不能为空'); return; }
  if (!plain(a)){ toast('答案不能为空'); return; }
  if (editingId){
    const c = getCard(editingId);
    if (c){
      c.q = q; c.a = a; c.tip = tip; c.tags = tags; c.star = editStar; c.mark = editMark;
      c.code = code; c.refs = refs; c.idx = editIdx.slice(); c.idxAuto = false;
    }
  } else {
    if (state.cards.length >= MAX_CARDS){ toast('已达上限'); return; }
    state.cards.push(sanitizeCard({ q:q, a:a, tip:tip, tags:tags, star:editStar, mark:editMark,
      code:code, refs:refs, idx:editIdx.slice(), idxAuto:false, stage:0, due:0, reps:0, created:now() }));
  }
  save(); D('maskEdit').hidden = true; newSession([]); renderAll();
  toast(editingId ? '已保存' : '已添加');
};
D('edDel').onclick = () => {
  if (!editingId) return;
  const id = editingId;
  D('maskEdit').hidden = true; removeCard(id);
};
D('edCancel').onclick = () => { D('maskEdit').hidden = true; };

/* 导入导出 */
D('btnImport').onclick = () => { D('impText').value = ''; D('maskImport').hidden = false; };
D('impCancel').onclick = () => { D('maskImport').hidden = true; };
D('impOk').onclick = () => {
  const res = parseSource(D('impText').value, false);
  if (!res.cards.length){ toast('没有解析到有效卡片'); return; }
  const room = Math.max(0, MAX_CARDS - state.cards.length);
  const take = res.cards.slice(0, room);
  const have = new Set(state.cards.map(c => key(c.q)));
  let added = 0, skipped = 0;
  for (const c of take){
    const k = key(c.q);
    if (have.has(k)){ skipped++; continue; }
    state.cards.push(c); have.add(k); added++;
  }
  save(); flushSave(); D('maskImport').hidden = true; newSession([]);
  if (state.settings.mode === 'cram') cramStart(true);
  renderAll();
  toast('导入 ' + added + ' 张' + (skipped ? '，跳过重复 ' + skipped : ''));
};
D('btnExport').onclick = () => {
  D('expCount').textContent = state.cards.length + ' 张';
  D('expText').value = JSON.stringify({ v:1, exportedAt:new Date().toISOString(),
    count:state.cards.length, cards:state.cards }, null, 1);
  D('maskExport').hidden = false;
};
D('expClose').onclick = () => { D('maskExport').hidden = true; };
D('expCopy').onclick = async () => {
  const t = D('expText').value;
  try { await navigator.clipboard.writeText(t); toast('已复制'); return; } catch(e){}
  try { D('expText').select(); document.execCommand('copy'); toast('已复制'); }
  catch(e){ toast('复制失败，请长按全选'); }
};
D('expFile').onclick = () => {
  try {
    const blob = new Blob([D('expText').value], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = APP.name + '-备份-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已生成备份文件');
  } catch(e){ toast('下载失败，请改用复制'); }
};

/* 设置 */
function openSettings(){
  D('setStat').textContent = state.cards.length + ' 张';
  D('optMode').querySelectorAll('[data-m]').forEach(b => {
    b.classList.toggle('on', b.dataset.m === state.settings.mode);
  });
  D('optNew').querySelectorAll('[data-n]').forEach(b => {
    b.classList.toggle('on', Number(b.dataset.n) === state.settings.dailyNew);
  });
  const k = counts(), bank = seedParsed().cards.length;
  const groups = findDupes();
  const extra = groups.reduce((s,g) => s + g.length - 1, 0);
  let size = 0;
  try { size = new Blob([JSON.stringify(state.cards)]).size; } catch(e){}
  D('todayNote').innerHTML =
      '内置题库 <b>' + bank + '</b> 张（版本 ' + APP.seedVer + '）　本地 <b>'
      + state.cards.length + '</b> 张<br>'
    + '重复组 <b>' + groups.length + '</b> 组（多出 <b>' + extra + '</b> 张）<br>'
    + '未学 <b>' + k.fresh + '</b>　到期 <b>' + k.due + '</b>　标记 <b>' + markedCount() + '</b><br>'
    + '今日已学新卡 <b>' + state.today.newCount + '</b> / ' + state.settings.dailyNew
    + '　复习 <b>' + state.today.reviewed + '</b> 次<br>'
    + '今日时长 <b>' + mmss(state.today.seconds) + '</b>　存储约 <b>'
    + (size/1024).toFixed(0) + ' KB</b>';
  D('maskSet').hidden = false;
}
D('gear').onclick = openSettings;
D('setDone').onclick = () => { D('maskSet').hidden = true; renderAll(); };
D('setToday').onclick = () => {
  ensureToday(); state.today.seconds = 0; save(); openSettings(); paintTime();
  toast('今日学时已归零');
};
D('setResetToday').onclick = () => {
  ensureToday(); state.today.newCount = 0; state.today.reviewed = 0;
  newSession([]); save(); flushSave(); renderAll(); openSettings();
  toast('已重置今日计数');
};
D('setSeed').onclick = () => {
  const n = mergeSeed();
  saveDirty = true; flushSave();
  newSession([]); renderAll(); openSettings();
  toast(n ? ('已补齐 ' + n + ' 张 · 共 ' + state.cards.length + ' 张')
          : ('题库已完整 · 共 ' + state.cards.length + ' 张'));
};
D('setReindex').onclick = () => {
  const n = reindexAuto();
  saveDirty = true; flushSave();
  renderAll(); openSettings();
  toast(n ? ('已重算 ' + n + ' 张') : '索引没有需要更新的');
};
D('setDup').onclick = () => {
  const groups = findDupes();
  const extra = groups.reduce((s,g) => s + g.length - 1, 0);
  if (!extra){ toast('没有发现重复卡片'); return; }
  const ok = window.confirm('发现 ' + groups.length + ' 组重复（共多出 ' + extra + ' 张）。\n\n'
    + '清理会保留每组中复习进度最多的那一张，合并标记/星级/编号，其余删除。\n\n确定清理？');
  if (!ok) return;
  const n = dedupe();
  save(); flushSave(); newSession([]); renderAll(); openSettings();
  toast('已清理 ' + n + ' 张重复 · 共 ' + state.cards.length + ' 张');
};
D('setResetAll').onclick = () => {
  const ok = window.confirm('重置全部复习进度：\n\n'
    + '所有 ' + state.cards.length + ' 张卡都会变回「新卡」，'
    + '阶数/到期时间/复习次数清零。\n\n卡片内容、个人标记、星级、编号、索引全部保留。\n\n确定？');
  if (!ok) return;
  for (const c of state.cards){
    c.stage = 0; c.due = 0; c.reps = 0; c.lapses = 0; c.lastAt = 0;
  }
  ensureToday();
  state.today.newCount = 0;
  state.today.reviewed = 0;
  newSession([]);
  save(); flushSave(); renderAll(); openSettings();
  toast('已重置，全部 ' + state.cards.length + ' 张变成新卡');
};
D('setClear').onclick = () => {
  const ok = window.confirm('清空全部卡片：\n\n'
    + '本地 ' + state.cards.length + ' 张卡会全部删除（包括自己加的）。\n'
    + '内置题库不受影响，点「补齐题库」可重新装入。\n\n'
    + '建议先「卡片库 → ⤒ 导出」备份。\n\n确定清空？');
  if (!ok) return;
  state.cards = [];
  cram.list = []; cram.pos = 0; cram.doneSet = {}; cram.unknownSet = {}; cram.retry = {};
  cramSave();
  state.seeded = true;
  state.seedVer = APP.seedVer;
  ensureToday();
  state.today.newCount = 0;
  state.today.reviewed = 0;
  newSession([]);
  save(); flushSave(); renderAll(); openSettings();
  toast('已清空。点「补齐题库」重新装入 ' + seedParsed().cards.length + ' 张');
};
D('optMode').onclick = e => {
  const b = e.target.closest ? e.target.closest('[data-m]') : null;
  if (!b) return;
  state.settings.mode = b.dataset.m;
  if (state.settings.mode === 'cram') cramStart(!cram.list.length);
  save(); flushSave();
  D('optMode').querySelectorAll('[data-m]').forEach(x => { x.classList.toggle('on', x === b); });
  renderAll();
};
D('optNew').onclick = e => {
  const b = e.target.closest ? e.target.closest('[data-n]') : null;
  if (!b) return;
  state.settings.dailyNew = Number(b.dataset.n);
  save();
  D('optNew').querySelectorAll('[data-n]').forEach(x => { x.classList.toggle('on', x === b); });
  newSession([]); renderAll(); openSettings();
};

/* 标签页 */
let curTab = 'review';
function switchTab(t){
  curTab = t;
  D('scrReview').hidden = (t !== 'review');
  D('scrCards').hidden = (t !== 'cards');
  D('scrIndex').hidden = (t !== 'index');
  D('fab').hidden = (t === 'review');
  document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('on', b.dataset.tab === t); });
  if (t === 'cards'){ renderChips(); renderList(); }
  else if (t === 'index') renderIndex();
  else render();
  paintTime();
}
document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => { Sound.unlock(); switchTab(b.dataset.tab); };
});
D('fab').onclick = () => openEditor(null);
D('search').addEventListener('input', e => {
  keyword = e.target.value; shown = 50; renderList();
});

document.addEventListener('keydown', e => {
  if (!D('maskEdit').hidden || !D('maskImport').hidden
      || !D('maskExport').hidden || !D('maskSet').hidden) return;
  if (curTab !== 'review') return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); goPrev(); return; }
  if (e.key === 'ArrowRight'){ e.preventDefault(); goNext(); return; }
  const isCram = state.settings.mode === 'cram';
  const rev = isCram ? cram.revealed : session.revealed;
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (!rev){
      if (isCram){ cram.revealed = true; Sound.unlock(); Sound.flip(); renderCram(); }
      else reveal();
    }
    return;
  }
  if (e.key.toLowerCase() === 'm' && !isCram){ toggleMark(curCard()); return; }
  if (!rev) return;
  if (isCram){
    if (e.key === '1') cramGrade('n');
    else if (e.key === '2') cramGrade('k');
  } else {
    if (e.key === '1') grade('f');
    else if (e.key === '2') grade('o');
    else if (e.key === '3') grade('e');
  }
});

/* 提示 */
let toastTimer = null;
function toast(msg, actionLabel, onAction){
  const el = D('toast');
  if (!el) return;
  el.innerHTML = ''; el.textContent = msg;
  if (actionLabel && onAction){
    const b = document.createElement('b');
    b.textContent = ' ' + actionLabel;
    b.style.cssText = 'color:#8FC8FF;margin-left:10px';
    b.onclick = ev => { ev.stopPropagation(); hideToast(); onAction(); };
    el.appendChild(b); el.style.pointerEvents = 'auto';
  } else el.style.pointerEvents = 'none';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 4200);
}
function hideToast(){
  const el = D('toast');
  if (el) el.classList.remove('show');
  clearTimeout(toastTimer);
}
function renderAll(){
  renderHeader(); renderBadge();
  if (curTab === 'cards'){ renderChips(); renderList(); }
  else if (curTab === 'index') renderIndex();
  else render();
}

/* 启动 */
function boot(){
  document.title = APP.name;
  if (D('appName')) D('appName').textContent = APP.name;
  ensureToday();
  if (!load()) state.cards = [];

  const fixed = normalizeAll();
  let added = 0;
  if (!state.seeded || (state.seedVer || 0) < APP.seedVer) added = mergeSeed();

  let idxN = 0;
  if ((state.idxVer || 0) < 1) idxN = applyIndexMigration();

  saveDirty = true; flushSave();

  cramLoad();
  if (state.settings.mode === 'cram' && !cram.list.length) cramStart(true);
  newSession([]);
  renderHeader(); renderBadge(); switchTab('review');
  startTimer();

  const groups = findDupes();
  const extra = groups.reduce((s,g) => s + g.length - 1, 0);
  const msg = [];
  if (added) msg.push('装入 ' + added + ' 张');
  if (fixed) msg.push('修正 ' + fixed + ' 张');
  if (idxN) msg.push('索引 ' + idxN + ' 张');
  msg.push('共 ' + state.cards.length + ' 张');
  setTimeout(() => {
    toast(msg.join('，') + (extra ? '　⚠有 ' + extra + ' 张重复，去设置清理' : ''));
  }, 350);
}

try { boot(); }
catch (err){
  const d = document.createElement('div');
  d.id = 'fatal';
  d.textContent = '初始化失败\n\n' + (err && err.stack ? err.stack : String(err))
    + '\n\n把这段发给我。数据没丢，还在浏览器里。';
  document.body.appendChild(d);
}
</script>
